{% extends "base.html" %}
{% block title %}Day pass {{ dp.code }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body text-center">
        <h4 class="mb-1">Day pass</h4>
        <p class="text-muted mb-3">Show this at reception</p>
        <img src="{{ url_for('member.day_pass_qr', pass_id=dp.id) }}"
             alt="QR code" style="max-width:280px;">
        <div class="mt-3">
          <div><strong>Code:</strong> <code>{{ dp.code }}</code></div>
          <div><strong>Location:</strong> {{ dp.location.name }}</div>
          <div><strong>Date:</strong> {{ dp.pass_date }}</div>
          <div><strong>Status:</strong>
            <span class="badge bg-{% if dp.status.value == 'checked_in' %}success{% elif dp.status.value == 'cancelled' %}secondary{% else %}primary{% endif %}">{{ dp.status.value.replace('_',' ') }}</span>
          </div>
        </div>
        <a href="{{ url_for('member.day_passes') }}" class="btn btn-link mt-3">Back</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
