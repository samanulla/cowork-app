{% extends "base.html" %}
{% block title %}My community profile{% endblock %}
{% block content %}
<h3>My community profile</h3>
<form method="post" class="card card-body">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-2"><label class="form-label small">Headline</label>
    <input class="form-control" name="headline" value="{{ profile.headline or '' }}" placeholder="e.g. Full-stack engineer @ Acme"></div>
  <div class="mb-2"><label class="form-label small">Bio</label>
    <textarea class="form-control" name="bio" rows="3">{{ profile.bio or '' }}</textarea></div>
  <div class="mb-2"><label class="form-label small">Skills (comma-separated)</label>
    <input class="form-control" name="skills" value="{{ profile.skills or '' }}"></div>
  <div class="mb-2"><label class="form-label small">LinkedIn URL</label>
    <input class="form-control" name="linkedin_url" value="{{ profile.linkedin_url or '' }}"></div>
  <div class="form-check mb-3">
    <input type="checkbox" class="form-check-input" id="is_public" name="is_public" {% if profile.is_public %}checked{% endif %}>
    <label class="form-check-label" for="is_public">Show my profile in the community directory</label>
  </div>
  <div><button class="btn btn-dark">Save</button></div>
</form>
{% endblock %}
